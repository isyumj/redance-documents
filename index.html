<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReDance — Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .logo {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.8px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 15px;
      color: #6e6e73;
      margin-bottom: 48px;
    }

    .cards {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 560px;
      width: 100%;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      text-decoration: none;
      color: #1d1d1f;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      flex: 1;
      min-width: 220px;
      transition: box-shadow 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 28px;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
    }

    .card-desc {
      font-size: 13px;
      color: #6e6e73;
      line-height: 1.5;
    }

    footer {
      margin-top: 56px;
      font-size: 13px;
      color: #6e6e73;
      text-align: center;
    }

    footer a {
      color: #6e6e73;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="logo">ReDance</div>
  <p class="tagline">Dance smarter, practice deeper.</p>

  <div class="cards">
    <a class="card" href="privacy.html">
      <div class="card-icon">🔒</div>
      <div class="card-title">Privacy Policy</div>
      <div class="card-desc">How we collect, use, and protect your information.</div>
    </a>
    <a class="card" href="terms.html">
      <div class="card-icon">📄</div>
      <div class="card-title">Terms of Use</div>
      <div class="card-desc">Rules and agreements for using the ReDance app.</div>
    </a>
  </div>

  <footer>
    <p>Questions? <a href="mailto:redance.hello@gmail.com">redance.hello@gmail.com</a></p>
  </footer>

</body>
</html>
